<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group 0251</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #222222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        h1 span {
            color: #0066ff;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        p {
            font-size: 1.2rem;
            color: #555555;
            max-width: 600px;
            line-height: 1.6;
        }

        footer {
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: #999999;
            border-top: 1px solid #eeeeee;
        }
    </style>
</head>

    <header>
        <h1>Group <span>0251</span></h1>
    </header>

    <main>
        <p>Добро пожаловать на наш сайт! Здесь будет основная информация о группе 0251.</p>
