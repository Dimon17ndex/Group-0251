.discipline-timeline-wrap {

}

/* Контейнер для заданий */

/* Обертка таймлайна */
.timeline-track {
    position: absolute;
    left: var(--line-x); 
    top: 0;
    bottom: 0;
    width: var(--line-width);

.timeline-line {

.timeline-dot {

}

.task-date {
    position: absolute;
    top: 0;
    left: 50%;

    line-height: 1.2;

}

/* Обертка для точки и пунктира */
.task-line-wrapper {
    position: absolute;
    left: var(--line-x);
    top: calc(50% + 16px);

    width: calc(100% - var(--line-x));
    height: 0;
    z-index: 0;
    pointer-events: none;
}

/* Точка ровно на основной линии */

}

/* Пунктирная линия */
.task-dashed-line {

            },
            'methods-geo': { title: 'Методы географических исследований', color: '#c77800', sections: [] },
            'meteorology': { title: 'Метеорология и климатология, гидрология', color: '#1565c0', sections: [] },
            'geology': { title: 'Геология и эволюционная география', color: '#6d4c41', sections: [] },
            'history-ru': { title: 'История России', color: '#c62828', sections: [] },
            'russian-state': { title: 'Основы российской государственности', color: '#ef6c00', sections: [] },
            'russian-lang': { title: 'Русский язык', color: '#d81b60', sections: [] },
            'english-lang': { title: 'Английский язык', color: '#111111', sections: [] },
            'biogeocenology': { title: 'Основы биогеоценологии', color: '#00a86b', sections: [] },
            'medical-basics': { title: 'Основы медицинских знаний', color: '#8e0000', sections: [] }
        };

        const EMPTY_TEXT = 'В скором времени мы собираемся добавить сюда задания и материалы, которые нам выдали на момент дистанционного обучения с 27 октября по 7 ноября.';

        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function formatTaskDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const taskDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const diffDays = Math.round((today - taskDay) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Сегодня';
            if (diffDays === 1) return 'Вчера';
            if (diffDays === 2) return 'Позавчера';

            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();

            if (yyyy === now.getFullYear()) return dd + '.' + mm;
            return dd + '.' + mm + '.' + yyyy;
        }

        function render() {
            let id = getParam('id');
            if (!id) {
                id = 'history-geo';
            }

            const root = document.getElementById('disciplineRoot');
            if (!root) return;

            const data = id ? DISCIPLINES[id] : null;

            if (!data) {
                root.innerHTML = `
                    <div class="not-found">
                        <div class="not-found-title">Дисциплина не найдена</div>
                        <div class="not-found-text">Проверьте адрес или вернитесь к списку дисциплин.</div>
                        <a class="not-found-link" href="index.html#disciplines">К дисциплинам</a>
                    </div>
                `;
                document.title = 'Дисциплина не найдена — География 2611-0251.1';
                return;
            }

            document.title = data.title + ' — География 2611-0251.1';

            let lastDateStr = null;

            const tasksHtml = (data.sections && data.sections.length > 0)
                ? data.sections.map((t, index) => {
                    let color = t.color || data.color || '#0066ff';
                    if (t.type === 'lecture') {
                        color = '#4a90e2'; 
                    } else if (t.type === 'practice') {
                        color = '#43a047'; 
                    }

                    const currentDateText = formatTaskDate(t.date);
                    
                    let dateHtml = '';
                    if (currentDateText && currentDateText !== lastDateStr) {
                        dateHtml = `<div class="task-date">${currentDateText}</div>`;
                    }
                    lastDateStr = currentDateText;

                    return `
                        <div class="task-wrapper">
                            ${dateHtml}

                            <div class="task-line-wrapper">
                                <div class="task-dot-small" style="background-color: ${color}; box-shadow: 0 0 0 2px #fff;"></div>
                                <div class="task-dashed-line" style="border-color: ${color};"></div>
                            </div>
                            
                            <button type="button" class="task-card" data-task-id="${escapeHtml(t.taskId || '')}" style="background:${color};">
                                ${escapeHtml(t.title || 'Задание')}
                            </button>
                        </div>
                    `;
                }).join('')
                : `<div class="discipline-empty">${escapeHtml(EMPTY_TEXT)}</div>`;

            root.innerHTML = `
                <div class="discipline-timeline-wrap">
                    <div class="discipline-hero" style="background:${data.color};">
                        <div class="discipline-hero-label">Дисциплина</div>
                        <div class="discipline-hero-title">${escapeHtml(data.title)}</div>
                    </div>
                    
                    <div class="discipline-content">
                        <div class="timeline-track">
                            <div class="timeline-line" style="background-color:${data.color};"></div>
                            <div class="timeline-dot" style="background-color:${data.color}; box-shadow: 0 0 0 3px #fff;"></div>
                        </div>
                        
                        ${tasksHtml}
                    </div>
                </div>
            `;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        render();

        document.getElementById('backBtn').addEventListener('click', () => {
            if (window.opener && !window.opener.closed) {
                window.close();
            } else {
                try { sessionStorage.setItem('returnToTab', 'disciplines'); } catch (e) {}
                window.location.href = 'index.html#disciplines';
            }
        });
    </script>
</body>
</html>
