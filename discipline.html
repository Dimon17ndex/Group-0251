/* === Таймлайн для дисциплины === */
.discipline-timeline-wrap {
    position: relative;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 20px 60px 32px;
    --line-x: 56px; 
    --line-width: 3px;
}

.discipline-hero {
    max-width: 760px;
    padding: 24px 24px 26px;
    border-radius: 16px;
    color: #fff;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    background: #0066ff;
    position: relative;
    z-index: 1;

    animation: heroIn 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}

/* Контейнер для заданий */
.discipline-content {
    position: relative;
    max-width: 100%;
    margin: 0;
    padding: 80px 0 24px 0; 
    z-index: 1;
    text-align: center;
}

/* Обертка таймлайна */
.timeline-track {
    position: absolute;
    left: var(--line-x); 
    top: 0;
    bottom: 0;
    width: var(--line-width);
    pointer-events: none;
    z-index: 0;
}

/* Линия рисуется сверху вниз */
.timeline-line {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    border-radius: 2px;
    transform-origin: top center;
    animation: lineDraw 0.4s cubic-bezier(0.22, 0.61, 0.36, 1) 0.35s both;
}

/* Точка появляется одновременно с окончанием линии (её задержку ставит JS) */
.timeline-dot {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 50%) scale(0.01);
    width: 18px;
    height: 18px;
    border-radius: 50%;
    z-index: 0;
    opacity: 0;
}

/* === Обертка для кнопки и даты === */
.task-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 24px;
    text-align: center;
    padding-top: 32px;

    opacity: 0;
}

.task-wrapper.is-shown {
    animation: taskIn 0.35s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}
.timeline-dot.is-shown {
    animation: dotIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

/* Дата задания (с подложкой) */
.task-date {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: inline-block;
    padding: 4px 12px;
    background: rgba(0, 0, 0, 0.06);
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #666;
    white-space: nowrap;
    line-height: 1.2;
    margin-top: -10px;
}

/* Обертка для точки и пунктира */
.task-line-wrapper {
    position: absolute;
    left: var(--line-x);
    top: calc(50% + 16px); 
    transform: translateY(-50%);
    width: calc(100% - var(--line-x));
    height: 0;
    z-index: 0;
    pointer-events: none;
}

/* Точка ровно на основной линии */
.task-dot-small {
    position: absolute;
    left: calc(var(--line-width) / 2);
    top: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    border-radius: 50%;
    z-index: 2;
}

/* Пунктирная линия */
.task-dashed-line {
    position: absolute;
    left: calc(var(--line-width) / 2 + 4px);
    top: 50%;
    width: calc(100% - (var(--line-width) / 2 + 4px));
    height: 0;
    border-bottom: 2px dashed; 
    z-index: 0;
}

        const EMPTY_TEXT = 'В скором времени мы собираемся добавить сюда задания и материалы, которые нам выдали на момент дистанционного обучения с 27 октября по 7 ноября.';

        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function formatTaskDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const taskDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const diffDays = Math.round((today - taskDay) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Сегодня';
            if (diffDays === 1) return 'Вчера';
            if (diffDays === 2) return 'Позавчера';

            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();

            if (yyyy === now.getFullYear()) return dd + '.' + mm;
            return dd + '.' + mm + '.' + yyyy;
        }

        function render() {
            let id = getParam('id');
            if (!id) {
                id = 'history-geo';
            }

            const root = document.getElementById('disciplineRoot');
            if (!root) return;

            const data = id ? DISCIPLINES[id] : null;

            if (!data) {
                root.innerHTML = `
                    <div class="not-found">
                        <div class="not-found-title">Дисциплина не найдена</div>
                        <div class="not-found-text">Проверьте адрес или вернитесь к списку дисциплин.</div>
                        <a class="not-found-link" href="index.html#disciplines">К дисциплинам</a>
                    </div>
                `;
                document.title = 'Дисциплина не найдена — География 2611-0251.1';
                return;
            }

            document.title = data.title + ' — География 2611-0251.1';

            let lastDateStr = null;

            const tasksHtml = (data.sections && data.sections.length > 0)
                ? data.sections.map((t, index) => {
                    let color = t.color || data.color || '#0066ff';
                    if (t.type === 'lecture') {
                        color = '#4a90e2'; 
                    } else if (t.type === 'practice') {
                        color = '#43a047'; 
                    }

                    const currentDateText = formatTaskDate(t.date);
                    
                    let dateHtml = '';
                    if (currentDateText && currentDateText !== lastDateStr) {
                        dateHtml = `<div class="task-date">${currentDateText}</div>`;
                    }
                    lastDateStr = currentDateText;

                    return `
                        <div class="task-wrapper">
                            ${dateHtml}

                            <div class="task-line-wrapper">
                                <div class="task-dot-small" style="background-color: ${color}; box-shadow: 0 0 0 2px #fff;"></div>
                                <div class="task-dashed-line" style="border-color: ${color};"></div>
                            </div>
                            
                            <button type="button" class="task-card" data-task-id="${escapeHtml(t.taskId || '')}" data-color="${color}" style="background:${color};">
                                ${escapeHtml(t.title || 'Задание')}
                            </button>
                        </div>
                    `;
                }).join('')
                : `<div class="discipline-empty">${escapeHtml(EMPTY_TEXT)}</div>`;

            root.innerHTML = `
                <div class="discipline-timeline-wrap">
                    <div class="discipline-hero" style="background:${data.color};">
                        <div class="discipline-hero-label">Дисциплина</div>
                        <div class="discipline-hero-title">${escapeHtml(data.title)}</div>
                    </div>
                    
                    <div class="discipline-content">
                        <div class="timeline-track">
                            <div class="timeline-line" style="background-color:${data.color};"></div>
                            <div class="timeline-dot" style="background-color:${data.color}; box-shadow: 0 0 0 3px #fff;"></div>
                        </div>
                        
                        ${tasksHtml}
                    </div>
                </div>
            `;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        render();

        // ==========================================
        // Синхронизация появления плашек с рисованием линии
        // ==========================================
        function syncTimelineAnimation() {
            const lineStart = 0.35;
            const lineDuration = 0.4;
            const lineEnd = lineStart + lineDuration;

            const line = document.querySelector('.timeline-line');
            const dot = document.querySelector('.timeline-dot');
            if (!line) return;

            const lineTop = line.getBoundingClientRect().top;
            const lineHeight = line.offsetHeight || 1;

            document.querySelectorAll('.task-wrapper').forEach((wrap) => {
                const anchor = wrap.querySelector('.task-line-wrapper') || wrap;
                const aRect = anchor.getBoundingClientRect();
                const anchorY = aRect.top;

                let ratio = (anchorY - lineTop) / lineHeight;
                ratio = Math.min(1, Math.max(0, ratio));

                const delayMs = (lineStart + ratio * lineDuration) * 1000;
                wrap.style.animationDelay = delayMs + 'ms';
                wrap.classList.add('is-shown');
            });

            if (dot) {
                dot.style.animationDelay = (lineEnd * 1000) + 'ms';
                dot.classList.add('is-shown');
            }
        }

        requestAnimationFrame(() => {
            requestAnimationFrame(syncTimelineAnimation);
        });

        // ==========================================
        // Эффект затухания при возврате
        // ==========================================
        const disciplineFadeVeil = document.getElementById('disciplineFadeVeil');
        let isLeaving = false;

        function fadeOutAndLeave(target) {
            if (isLeaving) return;
            isLeaving = true;

            // Шапку (лого + ГЕОГРАФИЯ + кнопка Назад) НЕ гасим.
            // Гасим только контент дисциплины и шторку задания.
            const fadeTargets = [
                document.querySelector('main'),
                document.getElementById('taskSheet')
            ].filter(Boolean);

            fadeTargets.forEach(el => {
                el.classList.add('discipline-fade-out');
            });

            setTimeout(() => {
                if (typeof target === 'function') target();
            }, 280);
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            if (window.opener && !window.opener.closed) {
                fadeOutAndLeave(() => {
                    window.close();
                });
            } else {
                fadeOutAndLeave(() => {
                    try { sessionStorage.setItem('returnToTab', 'disciplines'); } catch (e) {}
                    window.location.href = 'index.html#disciplines';
                });
            }
        });

        // ==========================================
        // Системная кнопка «Назад» на мобильных
        // ==========================================
        // Добавляем «пустую» запись, чтобы первое нажатие «Назад» вызвало popstate
        history.pushState({ discipline: true }, '', location.href);

        window.addEventListener('popstate', () => {
    if (isLeaving) return;

    fadeOutAndLeave(() => {
        // Если вкладка открыта скриптом (из index.html) — просто закрываемся,
        // чтобы вернуть пользователя к живой основной вкладке.
        if (window.opener && !window.opener.closed) {
            window.close();
            return;
        }
        // Иначе (прямой заход по ссылке) — обычный переход на index.html
        try { sessionStorage.setItem('returnToTab', 'disciplines'); } catch (e) {}
        window.location.href = 'index.html#disciplines';
    });

    // Возвращаем запись в историю, чтобы не уйти сразу
    try {
        history.pushState({ discipline: true }, '', location.href);
    } catch (e) {}
});

        // ==========================================
        // 11. Шторка задания
        // ==========================================
        (function initTaskSheet() {
            const sheet = document.getElementById('taskSheet');
            const content = document.getElementById('taskSheetContent');
            const titleEl = document.getElementById('taskSheetTitle');
            const bodyEl = document.getElementById('taskSheetBody');
            const closeBtn = document.getElementById('taskSheetClose');
            const handle = document.getElementById('taskSheetHandle');
            const header = sheet ? sheet.querySelector('.task-sheet-header') : null;
            if (!sheet || !content || !titleEl || !bodyEl) return;

            let startY = 0, currentY = 0, dragging = false;
            let active = false;

            function resetDrag() {
                dragging = false;
                startY = 0;
                currentY = 0;
                content.style.transition = '';
                content.style.transform = '';
                sheet.style.backgroundColor = '';
                sheet.style.backdropFilter = '';
                sheet.style.webkitBackdropFilter = '';
            }

            function openSheet(taskId, sourceCard) {
                const id = getParam('id') || 'history-geo';
                const data = DISCIPLINES[id];
                if (!data || !data.sections) return;
                const task = data.sections.find(t => t.taskId === taskId);
                if (!task) return;

                resetDrag();

                let color = task.color || data.color || '#0066ff';
                if (task.type === 'lecture') color = '#4a90e2';
                else if (task.type === 'practice') color = '#43a047';

                titleEl.textContent = task.title || 'Задание';
                titleEl.style.background = color;
                titleEl.setAttribute('data-task-id', taskId);

                let text = '';
                if (task.description) text += task.description + '\n\n';
                if (task.content) text += task.content;
                bodyEl.textContent = text.trim() || 'Описание задания пока не добавлено.';
                bodyEl.scrollTop = 0;

                active = true;
                sheet.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeSheet() {
                if (!active) return;
                active = false;
                resetDrag();
                sheet.classList.remove('active');
                document.body.style.overflow = '';
                bodyEl.scrollTop = 0;
            }

            document.querySelectorAll('.task-card').forEach(card => {
                card.addEventListener('click', () => {
                    if (!active) {
                        const taskId = card.getAttribute('data-task-id');
                        if (taskId) openSheet(taskId, card);
                    }
                });
            });

            if (closeBtn) closeBtn.addEventListener('click', closeSheet);
            sheet.addEventListener('click', (e) => {
                if (e.target === sheet) closeSheet();
            });

            function startDrag(e) {
                if (!active) return;
                const target = e.target;
                const startedOnHandle = handle && handle.contains(target);
                const startedOnHeader = header && header.contains(target);
                if (!startedOnHandle && !startedOnHeader) return;

                dragging = true;
                startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                currentY = startY;
                content.style.transition = 'none';
            }

            function onDrag(e) {
                if (!dragging || !active) return;
                currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                const dy = currentY - startY;
                if (dy > 0) {
                    content.style.transform = `translateY(${dy}px)`;
                    const ratio = Math.min(dy / 300, 1);
                    sheet.style.backgroundColor = `rgba(0,0,0,${0.4 - ratio * 0.4})`;
                    sheet.style.backdropFilter = `blur(${3 - ratio * 3}px)`;
                    sheet.style.webkitBackdropFilter = `blur(${3 - ratio * 3}px)`;
                }
            }

            function endDrag() {
                if (!dragging) return;
                dragging = false;
                content.style.transition = '';
                const dy = currentY - startY;
                if (dy > 100) {
                    closeSheet();
                } else {
                    resetDrag();
                }
            }

            [handle, header].forEach(el => {
                if (!el) return;
                el.addEventListener('mousedown', startDrag);
                el.addEventListener('touchstart', startDrag, { passive: true });
            });
            window.addEventListener('mousemove', onDrag);
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchmove', onDrag, { passive: true });
            window.addEventListener('touchend', endDrag);
            window.addEventListener('touchcancel', endDrag);
        })();
    </script>
</body>
