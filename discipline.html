    <script>
        // ==========================================
        // ВСТАВЬТЕ СЮДА ВАШУ ССЫЛКУ НА CSV
        // ==========================================
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSrCiJKSGBLtbLQlB7yI15G1gmDEJjUNorm1qxU4uKivoaiFfHJSbV1FKkEjs8Y46YyZudmcbjPzDNF/pub?gid=0&single=true&output=csv';

        const DISCIPLINES = {
            'history-geo': { title: 'История географических открытий', color: '#2e7d32' },
            'methods-geo': { title: 'Методы географических исследований', color: '#c77800' },
            'meteorology': { title: 'Метеорология и климатология, гидрология', color: '#1565c0' },
            'geology': { title: 'Геология и эволюционная география', color: '#6d4c41' },
            'history-ru': { title: 'История России', color: '#c62828' },
            'russian-state': { title: 'Основы российской государственности', color: '#ef6c00' },
            'russian-lang': { title: 'Русский язык', color: '#d81b60' },
            'english-lang': { title: 'Английский язык', color: '#111111' },
            'biogeocenology': { title: 'Основы биогеоценологии', color: '#00a86b' },
            'medical-basics': { title: 'Основы медицинских знаний', color: '#8e0000' }
        };

        const EMPTY_TEXT = 'В скором времени мы собираемся добавить сюда задания и материалы, которые нам выдали на момент дистанционного обучения с 27 октября по 7 ноября.';

        function getParam(name) {
            return new URLSearchParams(window.location.search).get(name);
        }

        function formatTaskDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';

            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const taskDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            const diffDays = Math.round((today - taskDay) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Сегодня';
            if (diffDays === 1) return 'Вчера';
            if (diffDays === 2) return 'Позавчера';

            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();

            if (yyyy === now.getFullYear()) return dd + '.' + mm;
            return dd + '.' + mm + '.' + yyyy;
        }

                // Функция для красивого вывода даты в шторке (например, "10 ноября 2026")
        function formatSheetDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '';

            const months = [
                'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
            ];

            const dd = d.getDate();
            const mm = months[d.getMonth()];
            const yyyy = d.getFullYear();
            const now = new Date();

            // Если год текущий, не выводим его
            if (yyyy === now.getFullYear()) {
                return `${dd} ${mm}`;
            }
            return `${dd} ${mm} ${yyyy}`;
        }

        function parseCSV(text) {
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (inQuotes) {
                    if (char === '"') {
                        if (nextChar === '"') {
                            currentCell += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        currentCell += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        currentRow.push(currentCell);
                        currentCell = '';
                    } else if (char === '\n' || char === '\r') {
                        if (char === '\r' && nextChar === '\n') i++;
                        currentRow.push(currentCell);
                        if (currentRow.length > 1 || currentRow[0] !== '') {
                            rows.push(currentRow);
                        }
                        currentRow = [];
                        currentCell = '';
                    } else {
                        currentCell += char;
                    }
                }
            }
            if (currentCell !== '' || currentRow.length > 0) {
                currentRow.push(currentCell);
                rows.push(currentRow);
            }
            return rows;
        }

        async function render() {
            const id = getParam('id') || 'history-geo';
            const root = document.getElementById('disciplineRoot');
            if (!root) return;

            const data = DISCIPLINES[id];
            if (!data) {
                root.innerHTML = `
                    <div class="not-found">
                        <div class="not-found-title">Дисциплина не найдена</div>
                        <div class="not-found-text">Проверьте адрес или вернитесь к списку дисциплин.</div>
                        <a class="not-found-link" href="index.html#disciplines">К дисциплинам</a>
                    </div>
                `;
                document.title = 'Дисциплина не найдена — География 2611-0251.1';
                return;
            }

            document.title = data.title + ' — География 2611-0251.1';

            root.innerHTML = `<div class="discipline-empty">Загрузка заданий...</div>`;

            let tasks = [];
            try {
                const cacheBuster = '&t=' + new Date().getTime();
                const response = await fetch(CSV_URL + cacheBuster);
                if (response.ok) {
                    const csvText = await response.text();
                    const rows = parseCSV(csvText);
                    if (rows.length > 0) {
                        const headers = rows[0];
                        const allTasks = rows.slice(1).map(row => {
                            const obj = {};
                            headers.forEach((header, index) => {
                                obj[header.trim()] = row[index] ? row[index].trim() : '';
                            });
                            return obj;
                        });
                        tasks = allTasks.filter(t => t.discipline_id === id);

// Сортировка: сначала те, у которых дата больше (свежие сверху)
tasks.sort((a, b) => {
    const dateA = a.date ? new Date(a.date).getTime() : 0;
    const dateB = b.date ? new Date(b.date).getTime() : 0;
    return dateB - dateA; // Если нужны старые сверху, поменяйте на dateA - dateB
});
                    }
                }
            } catch (e) {
                console.error('Ошибка загрузки заданий:', e);
            }

            let lastDateStr = null;

            const tasksHtml = (tasks.length > 0)
                ? tasks.map((t) => {
                    let color = t.color || data.color || '#0066ff';
                    if (t.type === 'lecture') {
                        color = '#4a90e2'; 
                    } else if (t.type === 'practice') {
                        color = '#43a047'; 
                    }

                    const currentDateText = formatTaskDate(t.date);
                    
                    let dateHtml = '';
                    if (currentDateText && currentDateText !== lastDateStr) {
                        dateHtml = `<div class="task-date">${currentDateText}</div>`;
                    }
                    lastDateStr = currentDateText;

                    return `
                        <div class="task-wrapper">
                            ${dateHtml}
                            <div class="task-line-wrapper">
                                <div class="task-dot-small" style="background-color: ${color}; box-shadow: 0 0 0 2px #fff;"></div>
                                <div class="task-dashed-line" style="border-color: ${color};"></div>
                            </div>
                            <button type="button" class="task-card" data-task-id="${escapeHtml(t.taskId || '')}" data-color="${color}" style="background:${color};">
                                ${escapeHtml(t.title || 'Задание')}
                            </button>
                        </div>
                    `;
                }).join('')
                : `<div class="discipline-empty">${escapeHtml(EMPTY_TEXT)}</div>`;

            root.innerHTML = `
                <div class="discipline-timeline-wrap">
                    <div class="discipline-hero" style="background:${data.color};">
                        <div class="discipline-hero-label">Дисциплина</div>
                        <div class="discipline-hero-title">${escapeHtml(data.title)}</div>
                    </div>
                    
                    <div class="discipline-content">
                        <div class="timeline-track">
                            <div class="timeline-line" style="background-color:${data.color};"></div>
                            <div class="timeline-dot" style="background-color:${data.color}; box-shadow: 0 0 0 3px #fff;"></div>
                        </div>
                        
                        ${tasksHtml}
                    </div>
                </div>
            `;

            requestAnimationFrame(() => {
                requestAnimationFrame(syncTimelineAnimation);
            });

            bindTaskSheetEvents(tasks, id, data.color);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function syncTimelineAnimation() {
            const lineStart = 0.35;
            const lineDuration = 0.4;
            const lineEnd = lineStart + lineDuration;

            const line = document.querySelector('.timeline-line');
            const dot = document.querySelector('.timeline-dot');
            if (!line) return;

            const lineTop = line.getBoundingClientRect().top;
            const lineHeight = line.offsetHeight || 1;

            document.querySelectorAll('.task-wrapper').forEach((wrap) => {
                const anchor = wrap.querySelector('.task-line-wrapper') || wrap;
                const aRect = anchor.getBoundingClientRect();
                const anchorY = aRect.top;

                let ratio = (anchorY - lineTop) / lineHeight;
                ratio = Math.min(1, Math.max(0, ratio));

                const delayMs = (lineStart + ratio * lineDuration) * 1000;
                wrap.style.animationDelay = delayMs + 'ms';
                wrap.classList.add('is-shown');
            });

            if (dot) {
                dot.style.animationDelay = (lineEnd * 1000) + 'ms';
                dot.classList.add('is-shown');
            }
        }

        const disciplineFadeVeil = document.getElementById('disciplineFadeVeil');
        let isLeaving = false;

        function fadeOutAndLeave(target) {
            if (isLeaving) return;
            isLeaving = true;

            const fadeTargets = [
                document.querySelector('main'),
                document.getElementById('taskSheet')
            ].filter(Boolean);

            fadeTargets.forEach(el => {
                el.classList.add('discipline-fade-out');
            });

            setTimeout(() => {
                if (typeof target === 'function') target();
            }, 280);
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            if (window.opener && !window.opener.closed) {
                fadeOutAndLeave(() => { window.close(); });
            } else {
                fadeOutAndLeave(() => {
                    try { sessionStorage.setItem('returnToTab', 'disciplines'); } catch (e) {}
                    window.location.href = 'index.html#disciplines';
                });
            }
        });

        history.pushState({ discipline: true }, '', location.href);

        window.addEventListener('popstate', () => {
            if (isLeaving) return;

            fadeOutAndLeave(() => {
                if (window.opener && !window.opener.closed) {
                    window.close();
                    return;
                }
                try { sessionStorage.setItem('returnToTab', 'disciplines'); } catch (e) {}
                window.location.href = 'index.html#disciplines';
            });

            try {
                history.pushState({ discipline: true }, '', location.href);
            } catch (e) {}
        });

        // ==========================================
        // 11. Шторка задания
        // ==========================================
        const sheet = document.getElementById('taskSheet');
        const content = document.getElementById('taskSheetContent');
        const titleEl = document.getElementById('taskSheetTitle');
        const bodyEl = document.getElementById('taskSheetBody');
        const closeBtn = document.getElementById('taskSheetClose');
        const handle = document.getElementById('taskSheetHandle');
        const header = sheet ? sheet.querySelector('.task-sheet-header') : null;

        let startY = 0, currentY = 0, dragging = false;
        let sheetActive = false;

        function resetDrag() {
            dragging = false;
            startY = 0;
            currentY = 0;
            content.style.transition = '';
            content.style.transform = '';
            sheet.style.backgroundColor = '';
            sheet.style.backdropFilter = '';
            sheet.style.webkitBackdropFilter = '';
        }

        async function openSheet(taskData, fallbackColor) {
    if (!taskData) return;
    resetDrag();

    // Если нет своего цвета и нет type, берем fallbackColor (цвет дисциплины)
    let color = taskData.color || (taskData.type ? '' : fallbackColor) || '#0066ff';
    
    if (taskData.type === 'lecture') color = '#4a90e2';
    else if (taskData.type === 'practice') color = '#43a047';

    titleEl.textContent = taskData.title || 'Задание';
    titleEl.style.background = color;
    titleEl.setAttribute('data-task-id', taskData.taskId);

        // 1. Выводим текст задания
    bodyEl.innerHTML = ''; 

    // Сначала выводим description (если есть) шрифтом Dela Gothic One
    if (taskData.description && taskData.description.trim() !== '') {
        const descDiv = document.createElement('div');
        descDiv.className = 'task-description-title';
        descDiv.textContent = taskData.description.trim();
        bodyEl.appendChild(descDiv);
    }

    // Затем выводим content (основной текст)
    if (taskData.content && taskData.content.trim() !== '') {
        const contentDiv = document.createElement('div');
        contentDiv.textContent = taskData.content.trim();
        // Небольшой отступ сверху, если есть описание
        contentDiv.style.marginTop = taskData.description ? '10px' : '0'; 
        bodyEl.appendChild(contentDiv);
    }

    // Если нет ни описания, ни контента
    if ((!taskData.description || taskData.description.trim() === '') && (!taskData.content || taskData.content.trim() === '')) {
        const emptyDiv = document.createElement('div');
        emptyDiv.textContent = 'Описание задания пока не добавлено.';
        bodyEl.appendChild(emptyDiv);
    }

            // Выводим дату задания (если она есть)
    if (taskData.date) {
        const formattedDate = formatSheetDate(taskData.date);
        if (formattedDate) {
            const dateDiv = document.createElement('div');
            dateDiv.style.marginTop = '20px';
            dateDiv.style.paddingTop = '15px';
            dateDiv.style.borderTop = '1px solid #eee';
            dateDiv.style.fontSize = '0.95rem';
            dateDiv.style.color = '#666';
            
            // Выравнивание по правому краю
            dateDiv.style.textAlign = 'right'; 
            
            dateDiv.innerHTML = `<span style="font-weight: 600; color: #000;">Дата:</span> ${formattedDate}`;
            bodyEl.appendChild(dateDiv);
        }
    }

            // 2. Проверяем наличие вложений
    if (taskData.attachments && taskData.attachments.trim() !== '') {
        const links = taskData.attachments.split(/[\s,]+/); 
        
        // Получаем подписи (если колонка captions заполнена)
        let captions = [];
        if (taskData.captions && taskData.captions.trim() !== '') {
            // Разбиваем по переносам строк, сохраняя пустые строки
captions = taskData.captions.replace(/\r/g, '').split('\n');
        }

        const attachDiv = document.createElement('div');
        attachDiv.style.marginTop = '20px';
        attachDiv.style.borderTop = '2px solid #eee';
        attachDiv.style.paddingTop = '15px';
        attachDiv.innerHTML = '<div style="font-weight: 600; margin-bottom: 10px; color: #000;">Вложения:</div>';
        
        bodyEl.appendChild(attachDiv);

        let isFirstAttachment = true;

        for (let i = 0; i < links.length; i++) {
            const link = links[i];
            if (!link.trim()) continue;

            // Если это картинка
            if (link.match(/\.(jpeg|jpg|gif|png|webp|svg)(\?.*)?$/i)) {
                
                if (!isFirstAttachment) {
                    const divider = document.createElement('div');
                    divider.style.margin = '20px 0';
                    divider.style.borderTop = '1px dashed #ccc';
                    attachDiv.appendChild(divider);
                }

                // Обертка для картинки и подписи
                const imgWrap = document.createElement('div');
                imgWrap.style.marginBottom = '15px';

                const img = document.createElement('img');
                img.src = link;
                img.style.maxWidth = '100%';
                img.style.borderRadius = '8px';
                img.style.display = 'block';
                img.style.boxShadow = '0 2px 8px rgba(0,0,0,0.1)';
                
                img.onerror = () => {
                    img.style.display = 'none';
                    imgWrap.innerHTML += `<div style="color: red; font-size: 0.9rem;">Не удалось загрузить картинку: ${link}</div>`;
                };
                imgWrap.appendChild(img);

                                // Добавляем подпись, если она есть и это не заглушка
                if (captions[i] && captions[i].trim() !== '' && captions[i].trim() !== '-' && captions[i].trim().toLowerCase() !== 'none') {
                    const captionEl = document.createElement('div');
                    captionEl.textContent = captions[i].trim();
                    captionEl.style.marginTop = '6px';
                    captionEl.style.fontSize = '0.85rem';
                    captionEl.style.color = '#666';
                    captionEl.style.fontStyle = 'italic';
                    captionEl.style.textAlign = 'center'; // Подпись по центру
                    imgWrap.appendChild(captionEl);
                }

                attachDiv.appendChild(imgWrap);
            } 
            // Если это документ
            else {
                if (!isFirstAttachment) {
                    const space = document.createElement('div');
                    space.style.marginTop = '15px';
                    attachDiv.appendChild(space);
                }
                
                const btn = document.createElement('a');
                btn.href = link;
                btn.target = '_blank';
                btn.rel = 'noopener noreferrer';
                btn.textContent = '📄 Открыть файл в новой вкладке';
                
                btn.style.display = 'inline-block';
                btn.style.padding = '10px 16px';
                btn.style.backgroundColor = '#f5f7ff';
                btn.style.color = '#0066ff';
                btn.style.textDecoration = 'none';
                btn.style.borderRadius = '8px';
                btn.style.fontWeight = '600';
                btn.style.border = '1px solid #e3e8ff';
                btn.style.transition = 'background 0.2s ease';
                
                btn.onmouseover = () => btn.style.backgroundColor = '#e9efff';
                btn.onmouseout = () => btn.style.backgroundColor = '#f5f7ff';

                attachDiv.appendChild(btn);
            }
            
            isFirstAttachment = false;
        }
    }

    bodyEl.scrollTop = 0;

    sheetActive = true;
    sheet.classList.add('active');
    document.body.style.overflow = 'hidden';
}

        function closeSheet() {
            if (!sheetActive) return;
            sheetActive = false;
            resetDrag();
            sheet.classList.remove('active');
            document.body.style.overflow = '';
            bodyEl.scrollTop = 0;
        }

        function bindTaskSheetEvents(tasks, disciplineId, fallbackColor) {
    document.querySelectorAll('.task-card').forEach(card => {
        card.addEventListener('click', () => {
            if (!sheetActive) {
                const taskId = card.getAttribute('data-task-id');
                const task = tasks.find(t => t.taskId === taskId);
                // Передаем fallbackColor (цвет дисциплины) в функцию
                if (task) openSheet(task, fallbackColor); 
            }
        });
    });
}

        if (closeBtn) closeBtn.addEventListener('click', closeSheet);
        if (sheet) {
            sheet.addEventListener('click', (e) => {
                if (e.target === sheet) closeSheet();
            });

            function startDrag(e) {
                if (!sheetActive) return;
                const target = e.target;
                const startedOnHandle = handle && handle.contains(target);
                const startedOnHeader = header && header.contains(target);
                if (!startedOnHandle && !startedOnHeader) return;

                dragging = true;
                startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                currentY = startY;
                content.style.transition = 'none';
            }

            function onDrag(e) {
                if (!dragging || !sheetActive) return;
                currentY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                const dy = currentY - startY;
                if (dy > 0) {
                    content.style.transform = `translateY(${dy}px)`;
                    const ratio = Math.min(dy / 300, 1);
                    sheet.style.backgroundColor = `rgba(0,0,0,${0.4 - ratio * 0.4})`;
                    sheet.style.backdropFilter = `blur(${3 - ratio * 3}px)`;
                    sheet.style.webkitBackdropFilter = `blur(${3 - ratio * 3}px)`;
                }
            }

            function endDrag() {
                if (!dragging) return;
                dragging = false;
                content.style.transition = '';
                const dy = currentY - startY;
                if (dy > 100) {
                    closeSheet();
                } else {
                    resetDrag();
                }
            }

            [handle, header].forEach(el => {
                if (!el) return;
                el.addEventListener('mousedown', startDrag);
                el.addEventListener('touchstart', startDrag, { passive: true });
            });
            window.addEventListener('mousemove', onDrag);
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchmove', onDrag, { passive: true });
            window.addEventListener('touchend', endDrag);
            window.addEventListener('touchcancel', endDrag);
        }

        render();
    </script>
</body>
