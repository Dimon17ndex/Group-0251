<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — География 2611-0251.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-box { width: 100%; max-width: 400px; padding: 30px; border: 1px solid #eee; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: #0066ff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #0052cc; }
        .toggle-link { display: block; text-align: center; margin-top: 15px; color: #0066ff; cursor: pointer; text-decoration: underline; font-size: 0.9rem; }
        .message { text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .error { color: #e53935; }
        .success { color: #43a047; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="auth-box">
        <h2 id="formTitle">Регистрация</h2>
        <!-- Поле для Имени (Username) -->
        <input type="text" id="username" placeholder="Ваше имя (никнейм)" required>
        <input type="password" id="password" placeholder="Пароль" required>
        <button id="submitBtn" onclick="handleAuth()">Зарегистрироваться</button>
        <span class="toggle-link" id="toggleLink" onclick="toggleMode()">Уже есть аккаунт? Войти</span>
        <div class="message" id="message"></div>
        <a href="index.html" class="back-link">← На главную</a>
    </div>

    <script>
        // ВАШИ КЛЮЧИ SUPABASE
        const SUPABASE_URL = 'ВАШ_PROJECT_URL';
        const SUPABASE_ANON_KEY = 'ВАШ_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isLoginMode = false;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('formTitle').textContent = isLoginMode ? 'Вход' : 'Регистрация';
            document.getElementById('submitBtn').textContent = isLoginMode ? 'Войти' : 'Зарегистрироваться';
            document.getElementById('toggleLink').textContent = isLoginMode ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
            document.getElementById('message').textContent = '';
            // Скрываем поле имени при входе (вход только по паролю и имени, поэтому имя нужно)
            // На самом деле для входа нам тоже нужно имя, чтобы сгенерировать email.
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');
            msg.textContent = 'Загрузка...';
            msg.className = 'message';

            if (!username || !password) {
                msg.textContent = 'Заполните все поля';
                msg.classList.add('error');
                return;
            }

            // Генерируем фейковый email из имени
            const fakeEmail = `${username.toLowerCase()}@example.com`;

            if (isLoginMode) {
                // ВХОД
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: fakeEmail,
                    password: password,
                });

                if (error) {
                    msg.textContent = 'Неверное имя или пароль';
                    msg.classList.add('error');
                } else {
                    msg.textContent = 'Вход выполнен!';
                    msg.classList.add('success');
                    // Перенаправляем на главную (по желанию)
                    // setTimeout(() => window.location.href = 'index.html', 1000);
                }
            } else {
                // РЕГИСТРАЦИЯ
                // 1. Создаем пользователя в Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: fakeEmail,
                    password: password,
                    options: {
                        data: {
                            username: username // Сохраняем имя в метаданных
                        }
                    }
                });

                if (authError) {
                    if (authError.message.includes('already registered')) {
                        msg.textContent = 'Это имя уже занято';
                    } else {
                        msg.textContent = authError.message;
                    }
                    msg.classList.add('error');
                    return;
                }

                // 2. Создаем запись в таблице profiles
                if (authData.user) {
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert([
                            { id: authData.user.id, username: username }
                        ]);

                    if (profileError) {
                        console.error('Ошибка создания профиля:', profileError);
                        msg.textContent = 'Ошибка при создании профиля. Попробуйте другое имя.';
                        msg.classList.add('error');
                    } else {
                        msg.textContent = 'Регистрация успешна! Теперь вы можете войти.';
                        msg.classList.add('success');
                    }
                }
            }
        }
    </script>
</body>
</html>
